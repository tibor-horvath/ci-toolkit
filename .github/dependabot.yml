version: 2

# Keeps the SHA-pinned actions from rotting. `self-check.yml` proves every
# `uses:` is pinned to a commit; nothing until now proved the commit was
# current, and a pin is only as good as its last review.
#
# Grouping is deliberately split by risk rather than by a single on/off switch:
#
#   minor + patch -> one grouped PR per week. Low-risk, high-volume, and not
#                    worth a review each.
#   major         -> falls outside the group, so one PR per action. These can
#                    change action inputs or runtime behavior, and `@v1`
#                    consumers inherit that on the next release — so each one
#                    is left for review (dependabot-pr.yml requests it)
#                    rather than auto-merged.
#   artifacts     -> upload-artifact and download-artifact must stay on
#                    compatible versions, so they always move together in one
#                    PR. Listed first: a dependency joins the first group it
#                    matches. A major in this group keeps the PR out of
#                    auto-merge, like any other major.

updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows/** only. The composite actions under
    # .github/actions/* pin third-party actions too (actions/cache,
    # setup-node, pnpm/action-setup) and are not scanned unless listed here.
    directories:
      - "/"
      - "/.github/actions/*"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Budapest"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      # Dependabot appends the scope, giving `fix(deps): bump ...`. That is a
      # patch bump in release-please, which moves `v1` — see the note below.
      prefix: "fix"

    groups:
      artifact-actions:
        applies-to: version-updates
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"

      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
