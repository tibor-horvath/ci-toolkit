name: .NET Build & Test (reusable)

# Reusable .NET pipeline with a single, uniform shape for every caller:
#
#   build ──▶ test            (unsharded: one test job)
#   build ──▶ test (unit)     (sharded: parallel test jobs)
#           └▶ test (integration)
#
# The build job compiles ONCE and publishes its output as an artifact; the
# test job(s) run `dotnet test --no-build`, so the compile is never repeated
# per shard. Build-only repos (run-tests: false) just skip the test job.
#
# Call it from a consumer repo with:
#   jobs:
#     dotnet:
#       name: .NET
#       uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-build-test.yml@v1
#       with: { dotnet-version: '10.0.x', test-matrix: '["unit","integration"]' }
#       secrets: inherit
#       permissions: { checks: write, contents: read }

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to install."
        type: string
        default: "10.0.x"
      build-project:
        description: >-
          Solution or project to restore/build/test. Leave empty to let the
          SDK auto-discover the single .sln/.slnx in the repo root.
        type: string
        default: ""
      configuration:
        description: "Build configuration."
        type: string
        default: "Release"
      run-tests:
        description: "Run the test job. Set false for build-only repos."
        type: boolean
        default: true
      test-matrix:
        description: >-
          JSON array of shard tokens. When set, runs one test job per shard,
          filtering each by `FullyQualifiedName~.<shard>.`
          (e.g. '["unit","integration"]'). Empty -> a single test job.
        type: string
        default: ""
      test-filter:
        description: "Single --filter expression (ignored when test-matrix is set)."
        type: string
        default: ""
      runsettings:
        description: "Path to a .runsettings file passed via `dotnet test --settings`."
        type: string
        default: ""
      collect-coverage:
        description: 'Add `--collect:"XPlat Code Coverage"` and upload the report.'
        type: boolean
        default: true
      test-report:
        description: >-
          Run the post-test report job: sums the trx counters and merges the
          per-shard coverage into workflow outputs and a job summary. Off by
          default because it costs an extra job — matrix outputs are
          last-writer-wins, so shards cannot aggregate anything themselves.
        type: boolean
        default: false
      coverage-threshold:
        description: >-
          Fail the run when merged line coverage is below this percentage
          (e.g. 80). 0 (default) reports without gating. Any value above 0
          implies `test-report`, since the merge happens in that job.
        type: number
        default: 0
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
    outputs:
      # All empty unless the report job runs — a skipped job contributes empty
      # strings rather than failing the caller's expression.
      tests-total:
        description: "Total tests across every shard."
        value: ${{ jobs.report.outputs.tests-total }}
      tests-passed:
        description: "Passed tests across every shard."
        value: ${{ jobs.report.outputs.tests-passed }}
      tests-failed:
        description: "Failed tests across every shard."
        value: ${{ jobs.report.outputs.tests-failed }}
      tests-skipped:
        description: "Tests reported as not executed across every shard."
        value: ${{ jobs.report.outputs.tests-skipped }}
      tests-outcome:
        description: "`passed`, `failed`, or `no-tests` when no trx was produced."
        value: ${{ jobs.report.outputs.tests-outcome }}
      coverage-line-rate:
        description: "Merged line coverage as a percentage, one decimal (e.g. 84.2)."
        value: ${{ jobs.report.outputs.coverage-line-rate }}
      coverage-branch-rate:
        description: "Merged branch coverage as a percentage, one decimal."
        value: ${{ jobs.report.outputs.coverage-branch-rate }}

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ inputs.build-project }}

      - name: Build
        run: dotnet build ${{ inputs.build-project }} --no-restore -c ${{ inputs.configuration }}

      - name: Package build output
        if: ${{ inputs.run-tests }}
        shell: bash
        # Tar the bin/obj trees into one file so artifact transfer is fast and
        # paths restore exactly (avoids upload-artifact's common-ancestor path
        # rewriting). -prune stops descent into matched dirs.
        run: |
          find . -type d \( -name bin -o -name obj \) -prune -print > build-dirs.txt
          tar -czf build-output.tar.gz -T build-dirs.txt
          echo "Packaged $(wc -l < build-dirs.txt) bin/obj dirs ($(du -h build-output.tar.gz | cut -f1))."

      - name: Upload build output
        if: ${{ inputs.run-tests }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    if: ${{ inputs.run-tests }}
    needs: build
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Empty test-matrix collapses to a single (unsharded) test job.
        shard: ${{ fromJSON(inputs.test-matrix != '' && inputs.test-matrix || '[""]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Same key as the build job → warm hit, so `--no-build` can resolve the
      # MSBuild targets/props that packages contribute, without a download.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output

      - name: Unpack build output
        shell: bash
        run: tar -xzf build-output.tar.gz

      - name: Test
        shell: bash
        env:
          BUILD_PROJECT: ${{ inputs.build-project }}
          CONFIG: ${{ inputs.configuration }}
          SHARD: ${{ matrix.shard }}
          TEST_FILTER: ${{ inputs.test-filter }}
          RUNSETTINGS: ${{ inputs.runsettings }}
          COLLECT: ${{ inputs.collect-coverage }}
        run: |
          args=(test)
          if [ -n "$BUILD_PROJECT" ]; then args+=("$BUILD_PROJECT"); fi
          args+=(--no-build -c "$CONFIG" --logger "trx;LogFileName=results.trx")
          if [ -n "$SHARD" ]; then
            args+=(--filter "FullyQualifiedName~.$SHARD.")
          elif [ -n "$TEST_FILTER" ]; then
            args+=(--filter "$TEST_FILTER")
          fi
          if [ -n "$RUNSETTINGS" ]; then args+=(--settings "$RUNSETTINGS"); fi
          if [ "$COLLECT" = "true" ]; then args+=(--collect:"XPlat Code Coverage"); fi
          echo "dotnet ${args[*]}"
          dotnet "${args[@]}"

      - name: Test summary
        if: ${{ always() }}
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Test Results${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        if: ${{ inputs.collect-coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore

      # The trx is what the report job sums. `always()` so a failing shard still
      # contributes its counts — a run that reports 0 failures because the job
      # died is worse than no number at all.
      - name: Upload test results
        if: ${{ always() && (inputs.test-report || inputs.coverage-threshold > 0) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: "**/TestResults/*.trx"
          retention-days: 1
          if-no-files-found: ignore


  report:
    name: Test & Coverage
    # One job for both aggregations. They have the same shape — wait for the
    # matrix, pull the per-shard artifacts, reduce them — and splitting them
    # would mean two billed minutes and two skipped jobs when disabled.
    #
    # A threshold implies the job: the merge that produces the number to gate
    # on happens here, so requiring both flags would only be a trap.
    if: >-
      ${{ always() && inputs.run-tests
          && (inputs.test-report || inputs.coverage-threshold > 0) }}
    needs: test
    runs-on: ${{ inputs.runs-on }}
    outputs:
      tests-total: ${{ steps.tests.outputs.total }}
      tests-passed: ${{ steps.tests.outputs.passed }}
      tests-failed: ${{ steps.tests.outputs.failed }}
      tests-skipped: ${{ steps.tests.outputs.skipped }}
      tests-outcome: ${{ steps.tests.outputs.outcome }}
      coverage-line-rate: ${{ steps.coverage.outputs.line-rate }}
      coverage-branch-rate: ${{ steps.coverage.outputs.branch-rate }}
    steps:
      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results*
          merge-multiple: true
          path: trx

      - name: Aggregate trx counters
        id: tests
        shell: bash
        run: |
          # Every trx carries one <Counters .../> element holding that file's
          # tallies, so summing it across shards is the whole job. Parsed with
          # sed rather than an XML tool so this does not depend on xmllint
          # being present on whatever runner the caller picked.
          find trx -type f -name '*.trx' > trx-files.txt 2>/dev/null || true

          attr() {
            # `[[:space:]]` on the left stops `passed` matching the tail of
            # `passedButRunAborted`.
            printf '%s' "$1" | sed -n "s/.*[[:space:]]$2=\"\([0-9]*\)\".*/\1/p"
          }

          total=0; passed=0; failed=0; skipped=0; files=0
          while IFS= read -r trx; do
            [ -f "$trx" ] || continue
            files=$((files + 1))
            counters=$(tr -d '\n' < "$trx" | grep -o '<Counters[^>]*>' | head -1)
            [ -n "$counters" ] || continue
            t=$(attr "$counters" total)
            p=$(attr "$counters" passed)
            f=$(attr "$counters" failed)
            n=$(attr "$counters" notExecuted)
            total=$((total + ${t:-0}))
            passed=$((passed + ${p:-0}))
            failed=$((failed + ${f:-0}))
            skipped=$((skipped + ${n:-0}))
          done < trx-files.txt

          if [ "$files" -eq 0 ]; then
            outcome="no-tests"
          elif [ "$failed" -gt 0 ]; then
            outcome="failed"
          else
            outcome="passed"
          fi

          {
            echo "total=${total}"
            echo "passed=${passed}"
            echo "failed=${failed}"
            echo "skipped=${skipped}"
            echo "outcome=${outcome}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Test totals"
            echo ""
            echo "| Total | Passed | Failed | Skipped | Outcome |"
            echo "|------:|-------:|-------:|--------:|:--------|"
            echo "| ${total} | ${passed} | ${failed} | ${skipped} | ${outcome} |"
            echo ""
            echo "_Summed from ${files} trx file(s) across all shards._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download coverage
        if: ${{ inputs.collect-coverage }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage*
          merge-multiple: true
          path: coverage

      - name: Setup .NET
        if: ${{ inputs.collect-coverage }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Merge coverage and check threshold
        id: coverage
        if: ${{ inputs.collect-coverage }}
        shell: bash
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail

          # `-gt` would abort on a fractional threshold, so compare with awk.
          over_zero() { awk -v t="${THRESHOLD:-0}" 'BEGIN { exit !(t + 0 > 0) }'; }

          reports=$(find coverage -type f -name 'coverage.cobertura.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            if over_zero; then
              echo "::error::coverage-threshold is set to ${THRESHOLD} but no" \
                   "cobertura reports were produced. Check that the test" \
                   "projects reference coverlet.collector."
              exit 1
            fi
            echo "::warning::No coverage reports found; nothing to merge."
            exit 0
          fi

          # ReportGenerator as a local tool rather than a pinned third-party
          # action: the SDK is already here, and it keeps the supply chain to
          # what NuGet already provides.
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"

          reportgenerator \
            "-reports:coverage/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Cobertura;MarkdownSummaryGithub"

          # The merged report's root element carries the overall rates as
          # fractions; the caller wants percentages.
          root=$(tr -d '\n' < coverage-report/Cobertura.xml \
            | grep -o '<coverage[^>]*>' | head -1)
          rate() {
            printf '%s' "$root" \
              | sed -n "s/.*[[:space:]]$1=\"\([0-9.]*\)\".*/\1/p"
          }
          line=$(rate line-rate); branch=$(rate branch-rate)
          line_pct=$(awk -v r="${line:-0}" 'BEGIN { printf "%.1f", r * 100 }')
          branch_pct=$(awk -v r="${branch:-0}" 'BEGIN { printf "%.1f", r * 100 }')

          {
            echo "line-rate=${line_pct}"
            echo "branch-rate=${branch_pct}"
          } >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## Coverage"
            echo ""
            cat coverage-report/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Merged ${reports} report(s): line ${line_pct}%, branch ${branch_pct}%."

          if over_zero; then
            if awk -v p="$line_pct" -v t="$THRESHOLD" 'BEGIN { exit !(p + 0 < t + 0) }'; then
              echo "::error::line coverage ${line_pct}% is below the ${THRESHOLD}% threshold"
              exit 1
            fi
            echo "Line coverage ${line_pct}% meets the ${THRESHOLD}% threshold."
          fi

      - name: Upload merged coverage report
        if: ${{ inputs.collect-coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-merged
          path: coverage-report
          if-no-files-found: ignore
