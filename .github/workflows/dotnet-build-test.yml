name: .NET Build & Test (reusable)

# Reusable .NET pipeline with a single, uniform shape for every caller:
#
#   build ──▶ test            (unsharded: one test job)
#   build ──▶ test (unit)     (sharded: parallel test jobs)
#           └▶ test (integration)
#
# The build job compiles ONCE and publishes its output as an artifact; the
# test job(s) run `dotnet test --no-build`, so the compile is never repeated
# per shard. Build-only repos (run-tests: false) just skip the test job.
#
# Call it from a consumer repo with:
#   jobs:
#     dotnet:
#       name: .NET
#       uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-build-test.yml@v1
#       with: { dotnet-version: '10.0.x', test-matrix: '["unit","integration"]' }
#       secrets: inherit
#       permissions: { checks: write, contents: read }

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to install."
        type: string
        default: "10.0.x"
      build-project:
        description: >-
          Solution or project to restore/build/test. Leave empty to let the
          SDK auto-discover the single .sln/.slnx in the repo root.
        type: string
        default: ""
      configuration:
        description: "Build configuration."
        type: string
        default: "Release"
      run-tests:
        description: "Run the test job. Set false for build-only repos."
        type: boolean
        default: true
      test-matrix:
        description: >-
          JSON array of shard tokens. When set, runs one test job per shard,
          filtering each by `FullyQualifiedName~.<shard>.`
          (e.g. '["unit","integration"]'). Empty -> a single test job.
        type: string
        default: ""
      test-filter:
        description: "Single --filter expression (ignored when test-matrix is set)."
        type: string
        default: ""
      runsettings:
        description: "Path to a .runsettings file passed via `dotnet test --settings`."
        type: string
        default: ""
      collect-coverage:
        description: 'Add `--collect:"XPlat Code Coverage"` and upload the report.'
        type: boolean
        default: true
      test-summary:
        description: >-
          Aggregate the trx results into workflow outputs (test counts). Off by
          default because it costs an extra job: matrix outputs are
          last-writer-wins, so shards cannot report totals themselves, and the
          numbers have to be summed by a job that runs exactly once.
        type: boolean
        default: false
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
    outputs:
      # All empty unless `test-summary` is enabled — a skipped job contributes
      # empty strings rather than failing the caller's expression.
      tests-total:
        description: "Total tests across every shard."
        value: ${{ jobs.totals.outputs.total }}
      tests-passed:
        description: "Passed tests across every shard."
        value: ${{ jobs.totals.outputs.passed }}
      tests-failed:
        description: "Failed tests across every shard."
        value: ${{ jobs.totals.outputs.failed }}
      tests-skipped:
        description: "Tests reported as not executed across every shard."
        value: ${{ jobs.totals.outputs.skipped }}
      tests-outcome:
        description: "`passed`, `failed`, or `no-tests` when no trx was produced."
        value: ${{ jobs.totals.outputs.outcome }}

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ inputs.build-project }}

      - name: Build
        run: dotnet build ${{ inputs.build-project }} --no-restore -c ${{ inputs.configuration }}

      - name: Package build output
        if: ${{ inputs.run-tests }}
        shell: bash
        # Tar the bin/obj trees into one file so artifact transfer is fast and
        # paths restore exactly (avoids upload-artifact's common-ancestor path
        # rewriting). -prune stops descent into matched dirs.
        run: |
          find . -type d \( -name bin -o -name obj \) -prune -print > build-dirs.txt
          tar -czf build-output.tar.gz -T build-dirs.txt
          echo "Packaged $(wc -l < build-dirs.txt) bin/obj dirs ($(du -h build-output.tar.gz | cut -f1))."

      - name: Upload build output
        if: ${{ inputs.run-tests }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    if: ${{ inputs.run-tests }}
    needs: build
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Empty test-matrix collapses to a single (unsharded) test job.
        shard: ${{ fromJSON(inputs.test-matrix != '' && inputs.test-matrix || '[""]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Same key as the build job → warm hit, so `--no-build` can resolve the
      # MSBuild targets/props that packages contribute, without a download.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output

      - name: Unpack build output
        shell: bash
        run: tar -xzf build-output.tar.gz

      - name: Test
        shell: bash
        env:
          BUILD_PROJECT: ${{ inputs.build-project }}
          CONFIG: ${{ inputs.configuration }}
          SHARD: ${{ matrix.shard }}
          TEST_FILTER: ${{ inputs.test-filter }}
          RUNSETTINGS: ${{ inputs.runsettings }}
          COLLECT: ${{ inputs.collect-coverage }}
        run: |
          args=(test)
          if [ -n "$BUILD_PROJECT" ]; then args+=("$BUILD_PROJECT"); fi
          args+=(--no-build -c "$CONFIG" --logger "trx;LogFileName=results.trx")
          if [ -n "$SHARD" ]; then
            args+=(--filter "FullyQualifiedName~.$SHARD.")
          elif [ -n "$TEST_FILTER" ]; then
            args+=(--filter "$TEST_FILTER")
          fi
          if [ -n "$RUNSETTINGS" ]; then args+=(--settings "$RUNSETTINGS"); fi
          if [ "$COLLECT" = "true" ]; then args+=(--collect:"XPlat Code Coverage"); fi
          echo "dotnet ${args[*]}"
          dotnet "${args[@]}"

      - name: Test summary
        if: ${{ always() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        if: ${{ inputs.collect-coverage }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore

      # The trx is what the totals job sums. `always()` so a failing shard still
      # contributes its counts — a run that reports 0 failures because the job
      # died is worse than no number at all.
      - name: Upload test results
        if: ${{ always() && inputs.test-summary }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: "**/TestResults/*.trx"
          retention-days: 1
          if-no-files-found: ignore

  totals:
    name: Test Totals
    # `always()` so failed shards are still counted; the job itself only reports.
    if: ${{ always() && inputs.run-tests && inputs.test-summary }}
    needs: test
    runs-on: ${{ inputs.runs-on }}
    outputs:
      total: ${{ steps.agg.outputs.total }}
      passed: ${{ steps.agg.outputs.passed }}
      failed: ${{ steps.agg.outputs.failed }}
      skipped: ${{ steps.agg.outputs.skipped }}
      outcome: ${{ steps.agg.outputs.outcome }}
    steps:
      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results*
          merge-multiple: true
          path: trx

      - name: Aggregate trx counters
        id: agg
        shell: bash
        run: |
          # Every trx carries one <Counters .../> element holding the whole
          # file's tallies, so summing that across shards is the entire job.
          # Parsed with sed rather than an XML tool to avoid depending on
          # xmllint being on whatever runner the caller picked.
          find trx -type f -name '*.trx' > trx-files.txt 2>/dev/null || true

          attr() {
            # `[[:space:]]` on the left guards against matching a longer
            # attribute that ends with the name we want.
            printf '%s' "$1" | sed -n "s/.*[[:space:]]$2=\"\([0-9]*\)\".*/\1/p"
          }

          total=0; passed=0; failed=0; skipped=0; files=0
          while IFS= read -r trx; do
            [ -f "$trx" ] || continue
            files=$((files + 1))
            counters=$(tr -d '\n' < "$trx" | grep -o '<Counters[^>]*>' | head -1)
            [ -n "$counters" ] || continue
            t=$(attr "$counters" total)
            p=$(attr "$counters" passed)
            f=$(attr "$counters" failed)
            n=$(attr "$counters" notExecuted)
            total=$((total + ${t:-0}))
            passed=$((passed + ${p:-0}))
            failed=$((failed + ${f:-0}))
            skipped=$((skipped + ${n:-0}))
          done < trx-files.txt

          if [ "$files" -eq 0 ]; then
            outcome="no-tests"
          elif [ "$failed" -gt 0 ]; then
            outcome="failed"
          else
            outcome="passed"
          fi

          {
            echo "total=${total}"
            echo "passed=${passed}"
            echo "failed=${failed}"
            echo "skipped=${skipped}"
            echo "outcome=${outcome}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Test totals"
            echo ""
            echo "| Total | Passed | Failed | Skipped | Outcome |"
            echo "|------:|-------:|-------:|--------:|:--------|"
            echo "| ${total} | ${passed} | ${failed} | ${skipped} | ${outcome} |"
            echo ""
            echo "_Summed from ${files} trx file(s) across all shards._"
          } >> "$GITHUB_STEP_SUMMARY"
