name: .NET Coverage Comment (reusable)

# Posts a code-coverage summary as a sticky pull-request comment, built from the
# `coverage*` artifacts that `dotnet-build-test.yml` uploads. Sharded runs are
# handled: every shard's report is merged before summarising.
#
# This is a separate workflow, not an input on dotnet-build-test, on purpose:
# commenting needs `pull-requests: write`, and a reusable workflow that asks for
# a permission its caller did not grant fails at startup — even when the job is
# skipped. Folding it in would break every existing caller of dotnet-build-test.
#
# Call it after the build/test job, on pull requests only:
#   jobs:
#     dotnet:
#       uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-build-test.yml@v1
#       permissions: { checks: write, contents: read }
#     coverage:
#       needs: dotnet
#       if: github.event_name == 'pull_request'
#       uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-coverage-comment.yml@v1
#       permissions: { contents: read, pull-requests: write }

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to install (ReportGenerator runs on it)."
        type: string
        default: "10.0.x"
      thresholds:
        description: 'Line-rate thresholds "<red-below> <green-from>", in percent.'
        type: string
        default: "60 80"
      fail-below-min:
        description: "Fail the job when line coverage is below the lower threshold. Off by default: the comment is informational."
        type: boolean
        default: false
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Job timeout in minutes."
        type: number
        default: 15
      cancel-superseded:
        description: >-
          Cancel an in-flight run of this workflow when a newer one starts for
          the same pull request. Only pull_request events are ever cancelled;
          push, schedule and release runs always complete.
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

# Supersede an in-flight run for the same pull request. The group is prefixed
# with this workflow's name so it cannot collide with the caller's own group.
concurrency:
  group: ${{ github.workflow }}-dotnet-coverage-comment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.cancel-superseded && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}

jobs:
  comment:
    name: Coverage comment
    # Fork PRs get a read-only token, so the comment step could only fail.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # `coverage` (unsharded) or `coverage-<shard>` (test-matrix). Merged into
      # one tree; each report sits under its own GUID-named TestResults folder,
      # so files do not collide.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage*
          merge-multiple: true
          path: coverage

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Merge coverage reports
        uses: danielpalme/ReportGenerator-GitHub-Action@cf6fe1b38ed5becc89ffe056c1f240825993be5b # v5.5.4
        with:
          reports: "coverage/**/coverage.cobertura.xml"
          targetdir: "coverage/merged"
          reporttypes: "Cobertura"

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/merged/Cobertura.xml
          badge: true
          fail_below_min: ${{ inputs.fail-below-min }}
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: ${{ inputs.thresholds }}

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          recreate: true
          path: code-coverage-results.md
