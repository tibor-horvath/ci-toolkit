name: NuGet Publish (reusable)

# Reusable NuGet pack + push. Pack the solution/project once, then push every
# resulting package (with --skip-duplicate so re-runs are idempotent). Mark
# non-package projects with <IsPackable>false</IsPackable> so only real
# packages are produced.
#
# Authentication: pass the `nuget-api-key` secret.
#
# nuget.org Trusted Publishing does NOT work through this workflow: nuget.org
# requires the OIDC `job_workflow_ref` claim to start with the caller's
# <owner>/<repo>/.github/workflows/, but a job in a reusable workflow from
# another repository reports this file (tibor-horvath/ci-toolkit/...), so the
# token exchange fails with HTTP 401. For Trusted Publishing use the composite
# action instead, which runs in the caller's own job:
#   uses: tibor-horvath/ci-toolkit/.github/actions/nuget-publish@v2
# Setting `nuget-user` here fails fast with a pointer to it.
#
# Example (publish on release, API key):
#   on:
#     release:
#       types: [published]
#   permissions:
#     contents: read
#   jobs:
#     publish:
#       uses: tibor-horvath/ci-toolkit/.github/workflows/nuget-publish.yml@v2
#       secrets:
#         nuget-api-key: ${{ secrets.NUGET_API_KEY }}

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to install."
        type: string
        default: "10.0.x"
      project:
        description: >-
          Solution or project to pack. Empty → SDK auto-discovers the root
          .sln/.slnx.
        type: string
        default: ""
      configuration:
        description: "Build configuration."
        type: string
        default: "Release"
      version:
        description: >-
          Package version. Empty → the release tag (github.ref_name) with any
          leading 'v' stripped (e.g. v3.1.0 → 3.1.0).
        type: string
        default: ""
      nuget-source:
        description: "NuGet feed to push to."
        type: string
        default: "https://api.nuget.org/v3/index.json"
      nuget-user:
        description: >-
          Unsupported here — nuget.org rejects the OIDC token of a job inside a
          cross-repository reusable workflow. Setting it fails the run with a
          pointer to the `.github/actions/nuget-publish` composite action, which
          supports Trusted Publishing. Kept only so existing callers get that
          error instead of an unknown-input failure.
        type: string
        default: ""
      include-symbols:
        description: "Also produce and push .snupkg symbol packages."
        type: boolean
        default: false
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Job timeout in minutes (applies to every job in this workflow)."
        type: number
        default: 60
    outputs:
      version:
        description: >-
          The version actually packed — the `version` input when set, otherwise
          the release tag with any leading 'v' stripped. Worth reading back,
          since the derived case is not knowable to the caller up front.
        value: ${{ jobs.publish.outputs.version }}
      packages:
        description: "Comma-separated .nupkg filenames that were packed and pushed."
        value: ${{ jobs.publish.outputs.packages }}
    secrets:
      nuget-api-key:
        description: >-
          API key for the target NuGet feed. Required.
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: NuGet Publish
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      packages: ${{ steps.pack.outputs.packages }}
    steps:
      - name: Check credentials
        shell: bash
        env:
          NUGET_USER: ${{ inputs.nuget-user }}
          HAS_KEY: ${{ secrets.nuget-api-key != '' }}
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "::error::nuget-user (Trusted Publishing) cannot work through this reusable workflow: nuget.org requires the OIDC job_workflow_ref to be in your repository. Use the composite action instead: uses: tibor-horvath/ci-toolkit/.github/actions/nuget-publish@v2 (see docs/nuget-publish.md)."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::No NuGet credentials: pass the nuget-api-key secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: tibor-horvath/ci-toolkit/.github/actions/cache@d9c2eac3bfc76a720ed60c343d7432430a3a8c0b # v1.15.0

      - name: Pack
        id: pack
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          CONFIG: ${{ inputs.configuration }}
          INPUT_VERSION: ${{ inputs.version }}
          SYMBOLS: ${{ inputs.include-symbols }}
        run: |
          version="$INPUT_VERSION"
          [ -z "$version" ] && version="${GITHUB_REF_NAME#v}"
          echo "Packing version: $version"

          args=(pack)
          [ -n "$PROJECT" ] && args+=("$PROJECT")
          args+=(-c "$CONFIG" -o artifacts
                 -p:PackageVersion="$version"
                 -p:ContinuousIntegrationBuild=true)
          if [ "$SYMBOLS" = "true" ]; then
            args+=(-p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg)
          fi
          dotnet "${args[@]}"
          ls -1 artifacts

          # Basenames only — the caller has no view of this runner's filesystem,
          # so an absolute path would be noise.
          pkgs=$(find artifacts -maxdepth 1 -name '*.nupkg' -printf '%f\n' \
            | sort | paste -sd, -)
          {
            echo "version=${version}"
            echo "packages=${pkgs}"
          } >> "$GITHUB_OUTPUT"

      - name: Push
        shell: bash
        env:
          SOURCE: ${{ inputs.nuget-source }}
          NUGET_API_KEY: ${{ secrets.nuget-api-key }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "$SOURCE" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
