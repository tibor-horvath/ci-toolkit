name: NuGet Publish (reusable)

# Reusable NuGet pack + push. Pack the solution/project once, then push every
# resulting package (with --skip-duplicate so re-runs are idempotent). Mark
# non-package projects with <IsPackable>false</IsPackable> so only real
# packages are produced.
#
# Authentication: set `nuget-user` to use nuget.org Trusted Publishing (OIDC →
# short-lived API key, no stored secret), or pass the `nuget-api-key` secret.
# The job requests `id-token: write`, so the caller must grant it either way.
#
# Example (publish on release, Trusted Publishing):
#   on:
#     release:
#       types: [published]
#   permissions:
#     contents: read
#   jobs:
#     publish:
#       permissions:
#         contents: read
#         id-token: write
#       uses: tibor-horvath/ci-toolkit/.github/workflows/nuget-publish.yml@v2
#       with:
#         nuget-user: ${{ vars.NUGET_USER }}

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to install."
        type: string
        default: "10.0.x"
      project:
        description: >-
          Solution or project to pack. Empty → SDK auto-discovers the root
          .sln/.slnx.
        type: string
        default: ""
      configuration:
        description: "Build configuration."
        type: string
        default: "Release"
      version:
        description: >-
          Package version. Empty → the release tag (github.ref_name) with any
          leading 'v' stripped (e.g. v3.1.0 → 3.1.0).
        type: string
        default: ""
      nuget-source:
        description: "NuGet feed to push to."
        type: string
        default: "https://api.nuget.org/v3/index.json"
      nuget-user:
        description: >-
          nuget.org username (profile name, not email) that owns the Trusted
          Publishing policy. When set, the push uses a short-lived API key from
          NuGet/login instead of the `nuget-api-key` secret.
        type: string
        default: ""
      include-symbols:
        description: "Also produce and push .snupkg symbol packages."
        type: boolean
        default: false
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Job timeout in minutes (applies to every job in this workflow)."
        type: number
        default: 60
    outputs:
      version:
        description: >-
          The version actually packed — the `version` input when set, otherwise
          the release tag with any leading 'v' stripped. Worth reading back,
          since the derived case is not knowable to the caller up front.
        value: ${{ jobs.publish.outputs.version }}
      packages:
        description: "Comma-separated .nupkg filenames that were packed and pushed."
        value: ${{ jobs.publish.outputs.packages }}
    secrets:
      nuget-api-key:
        description: >-
          Long-lived API key for the target NuGet feed. Required unless
          `nuget-user` is set (Trusted Publishing).
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: NuGet Publish
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # Trusted Publishing: GitHub OIDC token for NuGet/login
    outputs:
      version: ${{ steps.pack.outputs.version }}
      packages: ${{ steps.pack.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: tibor-horvath/ci-toolkit/.github/actions/cache@d9c2eac3bfc76a720ed60c343d7432430a3a8c0b # v1.15.0

      - name: Pack
        id: pack
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          CONFIG: ${{ inputs.configuration }}
          INPUT_VERSION: ${{ inputs.version }}
          SYMBOLS: ${{ inputs.include-symbols }}
        run: |
          version="$INPUT_VERSION"
          [ -z "$version" ] && version="${GITHUB_REF_NAME#v}"
          echo "Packing version: $version"

          args=(pack)
          [ -n "$PROJECT" ] && args+=("$PROJECT")
          args+=(-c "$CONFIG" -o artifacts
                 -p:PackageVersion="$version"
                 -p:ContinuousIntegrationBuild=true)
          if [ "$SYMBOLS" = "true" ]; then
            args+=(-p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg)
          fi
          dotnet "${args[@]}"
          ls -1 artifacts

          # Basenames only — the caller has no view of this runner's filesystem,
          # so an absolute path would be noise.
          pkgs=$(find artifacts -maxdepth 1 -name '*.nupkg' -printf '%f\n' \
            | sort | paste -sd, -)
          {
            echo "version=${version}"
            echo "packages=${pkgs}"
          } >> "$GITHUB_OUTPUT"

      # Requested right before the push: the temporary key is valid for 1 hour.
      - name: NuGet login (OIDC → temporary API key)
        id: login
        if: inputs.nuget-user != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ inputs.nuget-user }}

      - name: Push
        shell: bash
        env:
          SOURCE: ${{ inputs.nuget-source }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.nuget-api-key }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No NuGet credentials: set the nuget-user input (Trusted Publishing) or pass the nuget-api-key secret."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --source "$SOURCE" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
