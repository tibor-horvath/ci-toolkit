name: Secret Scan (reusable)

# Scans the commits a push or pull request introduces for leaked API keys,
# tokens, private keys and connection strings, so they fail the check before
# they reach the main branch.
#
# Runs the gitleaks CLI directly rather than gitleaks-action: the action needs
# a paid licence key for repos owned by an organisation, the CLI does not.
#
# Only the commits in the event's range are scanned (PR: base..head, push:
# before..after), so an old, already-rotated leak in history does not fail every
# new PR. Set `scan-full-history` to audit everything once.
#
# Matches are printed redacted — the log must not become a second leak.
#
# Call it from a consumer repo with:
#   on:
#     push: { branches: [main] }
#     pull_request:
#   jobs:
#     secrets:
#       uses: tibor-horvath/ci-toolkit/.github/workflows/secret-scan.yml@v1
#       permissions: { contents: read }

on:
  workflow_call:
    inputs:
      config:
        description: >-
          Path to a gitleaks config (custom rules / allowlists) in the caller
          repo. Empty -> a `.gitleaks.toml` at the repo root if present, else
          gitleaks' built-in ruleset.
        type: string
        default: ""
      scan-full-history:
        description: "Scan every reachable commit instead of only the event's range."
        type: boolean
        default: false
      gitleaks-version:
        description: "gitleaks release to install (without the leading `v`)."
        type: string
        default: "8.28.0"
      runs-on:
        description: "Runner label (must be Linux x64)."
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      # Full history: the range being scanned needs its base commit present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        # Verified against the checksums file published with the release. That
        # catches a truncated or corrupted download; it is not a defence against
        # a compromised release, since both files share an origin.
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${VERSION}_checksums.txt"
          curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/${sums}"
          sha256sum --ignore-missing -c "${sums}"
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan for secrets
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          CONFIG: ${{ inputs.config }}
          FULL: ${{ inputs.scan-full-history }}
        run: |
          set -euo pipefail

          args=(git --redact --verbose --exit-code 1)

          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          elif [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi

          # `a..b` limits the walk to commits reachable from b but not a.
          range=""
          if [ "$FULL" != "true" ]; then
            if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
              range="${PR_BASE}..${PR_HEAD}"
            elif [ "$EVENT" = "push" ] \
              && [ "${PUSH_BEFORE//0/}" != "" ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          fi

          if [ -n "$range" ]; then
            echo "Scanning commits ${range}"
            args+=(--log-opts "$range")
          else
            # New branch, force-push with an unreachable `before`, manual run,
            # or scan-full-history: nothing to diff against.
            echo "Scanning full history"
          fi

          ./gitleaks "${args[@]}"
