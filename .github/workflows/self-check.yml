name: Self Check

# Lints this repository's own workflows.
#
# The toolkit ships several hundred lines of bash embedded in YAML, and `@v1` is
# a moving tag — so a typo here reaches every consumer on the next merge, and
# only surfaces in *their* run. This job is the guard for that.
#
# actionlint covers both layers in one pass: it validates workflow syntax,
# expressions, `needs`/`if` references and matrix shapes, AND pipes every `run:`
# block through shellcheck (preinstalled on GitHub-hosted runners). The second
# job enforces the README's "all third-party actions are SHA-pinned" promise,
# which actionlint does not check.

# Pushes to main are covered by release.yml, which calls this workflow and only
# cuts a release if it passes — so there is no `push` trigger here.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SC2153 reads `$FOO` as a probable misspelling of a nearby `foo` local.
  # In workflow scripts the uppercase names come from the step's `env:` block,
  # which shellcheck never sees — actionlint hands it the script body alone —
  # so the check has no signal here and fires only false positives. A leading
  # `# shellcheck disable` comment does not cover this: without a shebang it
  # binds to the next command, not the script, so it would need repeating at
  # every assignment. workflow-lint passes `shellcheck-opts` through to
  # shellcheck as SHELLCHECK_OPTS.
  actionlint:
    name: actionlint
    uses: ./.github/workflows/workflow-lint.yml
    with:
      shellcheck-opts: "-e SC2153"
      # SHA pinning has its own job below, which also allows this repo's own
      # `tibor-horvath/ci-toolkit/*` references.
      require-pinned-actions: false
    permissions:
      contents: read

  # Dogfoods the toolkit's own reusable workflow on this repo's commits.
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  # Structural YAML checks. actionlint understands workflows but not the other
  # YAML here (action.yml, dependabot.yml, fixtures), and reports duplicate keys
  # less clearly than a dedicated linter.
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install yamllint
        # Bump manually — dependabot does not track versions held in run steps.
        run: pip install --quiet yamllint==1.37.1

      - name: Lint YAML
        run: yamllint --strict -c .yamllint.yml .github tests .yamllint.yml

  # Every reusable workflow must appear in the README and have a docs page that
  # names each of its inputs, secrets and outputs.
  docs-consistency:
    name: Docs match workflow interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check README and docs/
        run: |
          pip install --quiet pyyaml==6.0.2
          python .github/scripts/check-docs.py

  # Runtime smoke tests. actionlint cannot tell whether a script path or an
  # input name actually works — these run the reusable workflows for real
  # against dependency-free fixtures in tests/fixtures.
  smoke-node-build-test:
    name: Smoke - node-build-test
    uses: ./.github/workflows/node-build-test.yml
    with:
      working-directory: tests/fixtures/node-app
      test-shards: 2
      test-args: "--run"
    permissions:
      contents: read

  smoke-node-audit:
    name: Smoke - node-audit
    uses: ./.github/workflows/node-audit.yml
    with:
      working-directory: tests/fixtures/node-app
    permissions:
      contents: read

  # Local path: self-check runs against this checkout, so it exercises the PR's
  # version of the composite action (consumers reference it by tag instead).
  smoke-node-setup:
    name: Smoke - node-setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        id: node
        uses: ./.github/actions/node-setup
        with:
          working-directory: tests/fixtures/node-app

      - name: Verify detection and install
        shell: bash
        env:
          PM: ${{ steps.node.outputs.package-manager }}
          LOCKFILE: ${{ steps.node.outputs.lockfile }}
        run: |
          test "$PM" = "npm"
          test "$LOCKFILE" = "package-lock.json"
          cd tests/fixtures/node-app && npm run lint

  smoke-dotnet-build-test:
    name: Smoke - dotnet-build-test
    uses: ./.github/workflows/dotnet-build-test.yml
    with:
      build-project: tests/fixtures/dotnet-app/Fixture.slnx
      test-matrix: '["unit"]'
    permissions:
      checks: write
      contents: read

  smoke-dotnet-vulnerable-packages:
    name: Smoke - dotnet-vulnerable-packages
    uses: ./.github/workflows/dotnet-vulnerable-packages.yml
    with:
      project: tests/fixtures/dotnet-app/Fixture.slnx
    permissions:
      contents: read

  # A reusable workflow with no `permissions:` inherits the caller's default
  # token scope, which is often read-write. Require every workflow to declare
  # its own, or opt out deliberately with `# self-check: inherit-permissions`
  # (for workflows whose needs depend on the caller, e.g. docker-publish).
  explicit-permissions:
    name: Workflows declare permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check every workflow declares `permissions:`
        shell: bash
        run: |
          set -euo pipefail

          fail=0
          for f in .github/workflows/*.yml; do
            if grep -qE '^[[:space:]]*# self-check: inherit-permissions' "$f"; then
              echo "  skip  ${f} (inherits caller permissions by design)"
            elif grep -qE '^[[:space:]]*permissions:' "$f"; then
              echo "  ok    ${f}"
            else
              echo "::error file=${f}::no \`permissions:\` block (top-level or per-job)"
              fail=1
            fi
          done

          exit "$fail"

  pinned-actions:
    name: Actions are SHA-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check every `uses:` resolves to a full commit SHA
        shell: bash
        run: |
          set -euo pipefail

          # Only real `uses:` keys — a leading `#` (the caller examples in the
          # header comments) does not match. Composite actions under
          # .github/actions carry third-party `uses:` too.
          grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows .github/actions > uses.txt || true

          fail=0
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            ref=$(printf '%s' "$hit" \
              | sed -E 's/.*uses:[[:space:]]*//; s/[[:space:]]+#.*$//' \
              | tr -d '[:space:]')

            case "$ref" in
              # Local composite actions and same-repo reusable workflows are
              # versioned by this repo's own tags, not by SHA.
              ./*|docker://*|tibor-horvath/ci-toolkit/*) continue ;;
            esac

            if printf '%s' "$ref" | grep -qE '@[0-9a-f]{40}$'; then
              echo "  ok  ${ref}"
            else
              echo "::error file=${file},line=${line}::action is not SHA-pinned: ${ref}"
              fail=1
            fi
          done < uses.txt

          exit "$fail"
