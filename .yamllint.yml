extends: default

# Structural checks only (duplicate keys, bad indentation, syntax). Style rules
# that fight GitHub Actions conventions are relaxed.
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false        # `on:` is a key, not a boolean
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1     # `{ contents: read }` is used throughout
  brackets:
    max-spaces-inside: 1
